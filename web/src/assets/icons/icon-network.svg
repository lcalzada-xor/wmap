<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Hexagon outline -->
  <polygon points="32,8 54,20 54,44 32,56 10,44 10,20" stroke="white" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
  <!-- Center circle -->
  <circle cx="32" cy="32" r="5" fill="white"/>
  <!-- Connection lines from center to hex corners -->
  <line x1="32" y1="27" x2="32" y2="11" stroke="white" stroke-width="1.5" opacity="0.7"/>
  <line x1="36.3" y1="29.5" x2="51" y2="21" stroke="white" stroke-width="1.5" opacity="0.7"/>
  <line x1="36.3" y1="34.5" x2="51" y2="43" stroke="white" stroke-width="1.5" opacity="0.7"/>
  <line x1="32" y1="37" x2="32" y2="53" stroke="white" stroke-width="1.5" opacity="0.7"/>
  <line x1="27.7" y1="34.5" x2="13" y2="43" stroke="white" stroke-width="1.5" opacity="0.7"/>
  <line x1="27.7" y1="29.5" x2="13" y2="21" stroke="white" stroke-width="1.5" opacity="0.7"/>
  <!-- Corner dots -->
  <circle cx="32" cy="10" r="2.5" fill="white" opacity="0.8"/>
  <circle cx="52" cy="21" r="2.5" fill="white" opacity="0.8"/>
  <circle cx="52" cy="43" r="2.5" fill="white" opacity="0.8"/>
  <circle cx="32" cy="54" r="2.5" fill="white" opacity="0.8"/>
  <circle cx="12" cy="43" r="2.5" fill="white" opacity="0.8"/>
  <circle cx="12" cy="21" r="2.5" fill="white" opacity="0.8"/>
</svg>
